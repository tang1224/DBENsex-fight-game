<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>性愛格鬥 - 轟燈矢 vs 轟炎司</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        
        :root {
            --bg: #1f1b2e;
            --panel: #2a2438;
            --accent: #ff4d4d;
            --stamina: #7fb8a8;
            --pleasure: #ff4d94;
            --text: #f0e6d8;
        }
        
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Noto Sans TC', system-ui, sans-serif;
            background: linear-gradient(180deg, #1f1b2e 0%, #16121f 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        #app {
            width: 100%;
            max-width: 480px;
            background: var(--panel);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            border: 3px solid var(--accent);
        }
        
        header {
            background: linear-gradient(90deg, #3a2e4f, #5c4866);
            padding: 14px;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .status-container {
            display: flex;
            padding: 16px 20px 10px;
            gap: 12px;
            background: #221d32;
        }
        
        .player-panel, .enemy-panel {
            flex: 1;
            background: rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 12px;
        }
        
        .player-panel { border: 2px solid #ff8c00; }
        .enemy-panel { border: 2px solid #ff4d94; }
        
        .name {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .bars { display: flex; flex-direction: column; gap: 10px; }
        
        .bar-label {
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 3px;
        }
        
        .bar-outer {
            height: 18px;
            background: #16121f;
            border-radius: 9999px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.1);
        }
        
        .bar-inner {
            height: 100%;
            transition: width 0.4s ease;
            border-radius: 9999px;
        }
        
        .stamina-bar { background: linear-gradient(90deg, #7fb8a8, #a3d9c9); }
        .pleasure-bar { background: linear-gradient(90deg, #ff4d94, #ff99cc); }
        
        .pleasure-bar.warning {
            animation: pulse 800ms infinite alternate;
        }
        
        @keyframes pulse {
            from { box-shadow: 0 0 8px #ff4d94; }
            to { box-shadow: 0 0 20px #ff4d94; }
        }
        
        .log-container {
            height: 260px;
            background: #16121f;
            margin: 0 16px 12px;
            border-radius: 14px;
            padding: 14px;
            overflow-y: auto;
            font-size: 15px;
            line-height: 1.5;
        }
        
        .log-entry { margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px dashed rgba(255,77,77,0.3); }
        .log-entry:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        
        .player-turn { color: #ff8c00; }
        .enemy-turn { color: #ff4d94; }
        
        .skills-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            padding: 16px;
            background: #221d32;
        }
        
        .skill-btn {
            background: rgba(255,255,255,0.1);
            border: 2px solid var(--accent);
            border-radius: 12px;
            padding: 12px 8px;
            text-align: center;
            min-height: 92px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .skill-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(255,77,77,0.4); }
        .skill-btn:disabled { opacity: 0.4; filter: grayscale(1); cursor: not-allowed; }
        
        .cooldown {
            position: absolute;
            top: 6px; right: 6px;
            background: #ff4d94;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 9999px;
        }
        
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        
        .modal-content {
            background: #2a2438;
            width: 92%;
            max-width: 420px;
            border-radius: 20px;
            padding: 28px 24px;
            text-align: center;
            border: 4px solid #ff4d4d;
        }
        
        button.restart {
            background: linear-gradient(90deg, #ff4d94, #ff8c00);
            color: white;
            border: none;
            padding: 16px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 9999px;
            width: 100%;
            margin-top: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="app">
        <header>🔥 性愛格鬥 🔥<br>轟燈矢（攻） vs 轟炎司（受）</header>
        
        <div class="status-container">
            <!-- 轟燈矢（你・攻） -->
            <div class="player-panel">
                <div class="name">轟燈矢 🔥<span style="font-size:14px;margin-left:8px;">👤</span></div>
                <div class="bars">
                    <div class="bar-group">
                        <div class="bar-label"><span>體力</span><span id="p-hp-text">100/100</span></div>
                        <div class="bar-outer"><div id="p-hp-bar" class="bar-inner stamina-bar" style="width:100%"></div></div>
                    </div>
                    <div class="bar-group">
                        <div class="bar-label"><span>快感</span><span id="p-pleasure-text">0/100</span></div>
                        <div class="bar-outer"><div id="p-pleasure-bar" class="bar-inner pleasure-bar" style="width:0%"></div></div>
                    </div>
                </div>
            </div>
            
            <!-- 轟炎司（老爸・受） -->
            <div class="enemy-panel">
                <div class="name">轟炎司 💥<span style="font-size:14px;margin-left:8px;">👔</span></div>
                <div class="bars">
                    <div class="bar-group">
                        <div class="bar-label"><span>體力</span><span id="e-hp-text">100/100</span></div>
                        <div class="bar-outer"><div id="e-hp-bar" class="bar-inner stamina-bar" style="width:100%"></div></div>
                    </div>
                    <div class="bar-group">
                        <div class="bar-label"><span>快感</span><span id="e-pleasure-text">0/100</span></div>
                        <div class="bar-outer"><div id="e-pleasure-bar" class="bar-inner pleasure-bar" style="width:0%"></div></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="log" class="log-container"></div>
        
        <div id="skills-grid" class="skills-grid"></div>
    </div>

    <!-- 結局 Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title" style="margin-bottom:12px;"></h2>
            <div id="modal-result" style="line-height:1.6; font-size:15.5px; margin:16px 0;"></div>
            
            <div style="background:#16121f; padding:14px; border-radius:12px; text-align:left; font-size:14px; margin:20px 0;">
                <div>回合數：<span id="final-rounds"></span></div>
                <div>轟燈矢 最終：體力 <span id="final-p-hp"></span>　快感 <span id="final-p-pleasure"></span></div>
                <div>轟炎司 最終：體力 <span id="final-e-hp"></span>　快感 <span id="final-e-pleasure"></span></div>
            </div>
            
            <button onclick="restartGame()" class="restart">🔄 再來一局 操死老爸</button>
        </div>
    </div>

    <script>
        let pHP = 100, pPleasure = 0;        // 轟燈矢（你・攻）
        let eHP = 100, ePleasure = 0;        // 轟炎司（老爸・受）
        let round = 0;
        let gameEnded = false;
        
        let pCooldown = new Array(6).fill(0);
        let eCooldown = new Array(6).fill(0);

        // 轟燈矢（兒子・攻）的病嬌男同骨科技能
        const playerSkills = [
            {id:0, name:"深喉老爸", shortDesc:"消耗14體力，對方+30快感", cost:14, oppD:30, selfD:8, hpR:0, cd:0,
             flavors:["你跪在老爸面前，病態地深喉他的粗大肉棒，舌頭狂纏：「老爸…你是我的…不准射給別人…」","你用力吸吮到喉嚨深處，眼睛發紅盯著老爸：「我要讓你只記得兒子的嘴巴…」"]},
            {id:1, name:"手指玩前列腺", shortDesc:"消耗16體力，對方+38快感", cost:16, oppD:38, selfD:10, hpR:0, cd:0,
             flavors:["你把手指插進老爸緊熱的後穴，精準抠挖前列腺，病嬌低語：「老爸…這裡是兒子的專屬…不准給別人碰…」","手指快速抽插老爸的G點，你笑得陰沉：「被兒子玩到噴水…好可愛…」"]},
            {id:2, name:"夾緊後穴狂幹", shortDesc:"消耗18體力，對方+48快感（自+15）", cost:18, oppD:48, selfD:15, hpR:0, cd:1,
             flavors:["你跨坐在老爸身上，用力夾緊後穴猛套他的肉棒，病嬌呢喃：「老爸…你的雞巴只能被我幹…我要操壞你…」","後穴死死咬住老爸的粗屌，你紅著眼：「不准射出去…全部射在兒子裡面…」"]},
            {id:3, name:"騎乘位爆插", shortDesc:"消耗24體力，對方+58快感", cost:24, oppD:58, selfD:18, hpR:0, cd:0,
             flavors:["你主動騎上去瘋狂套弄，病嬌低吼：「老爸…被兒子騎乘的感覺…是不是很爽？不准反抗我…」","騎乘位讓你完全掌控，你笑得扭曲：「老爸的後穴…從今天起就是兒子的專屬肉便器…」"]},
            {id:4, name:"火焰SM", shortDesc:"消耗35體力，對方+82快感（冷卻4）", cost:35, oppD:82, selfD:25, hpR:0, cd:4,
             flavors:["你用自己的火焰在老爸身上畫出淫紋，一邊猛插後穴一邊燒…「老爸…火焰對你來說只是小case吧？那就好好享受兒子的SM…」","火焰SM讓老爸全身發燙，你病嬌地笑：「老爸…被兒子用火玩弄…還敢硬著？我要燒壞你…」"]},
            {id:5, name:"喘息恢復", shortDesc:"恢復40體力，-30快感（冷卻3）", cost:0, oppD:0, selfD:-30, hpR:40, cd:3,
             flavors:["你深呼吸壓下快感，眼睛依然死盯著老爸：「還沒操夠…老爸還不能壞掉…」","你暫時放緩動作，病嬌低語：「老爸…你只能被我一個人幹壞…」"]}
        ];

        // 轟炎司（老爸・受）的反擊技能
        const enemySkills = [
            {id:0, name:"粗暴揉兒子", shortDesc:"消耗12體力，對方+28快感", cost:12, oppD:28, selfD:6, hpR:0, cd:0,
             flavors:["轟炎司大手用力揉你的肉棒，喘息道：「不孝子…爸爸要教訓你…」","他低頭吸咬你的乳頭，火焰熱度讓你全身發燙。"]},
            {id:1, name:"手指猛摳前列腺", shortDesc:"消耗15體力，對方+36快感", cost:15, oppD:36, selfD:9, hpR:0, cd:0,
             flavors:["老爸粗暴地把手指插進你後穴，狂摳你的前列腺…「這裡是不是很爽？兒子！」","他手指彎曲猛幹你的G點，你差點腿軟。"]},
            {id:2, name:"猛幹兒子後穴💥", shortDesc:"消耗22體力，對方+50快感（冷卻1）", cost:22, oppD:50, selfD:12, hpR:0, cd:1,
             flavors:["轟炎司從後面狠狠插入，一手掐著你的脖子猛幹…「不孝子！爸爸要幹穿你！」","後入位讓他插得極深，每一下都撞到你最敏感的地方。"]},
            {id:3, name:"壓制狂幹", shortDesc:"消耗26體力，對方+60快感", cost:26, oppD:60, selfD:16, hpR:0, cd:0,
             flavors:["他把你壓在身下粗暴抽插…「燈矢…爸爸要射滿你的腸道！」","老爸用火焰般的熱度貫穿你，你只能抓著床單浪叫。"]},
            {id:4, name:"極限爆射大招", shortDesc:"消耗40體力，對方+90快感（冷卻5）", cost:40, oppD:90, selfD:30, hpR:0, cd:5,
             flavors:["轟炎司徹底失控，把你雙腿扛在肩上極限狂幹…「兒子！爸爸要射死你了！！」","大招發動，你被老爸幹得眼前發白。"]},
            {id:5, name:"英雄冷卻", shortDesc:"恢復42體力，-35快感（冷卻2）", cost:0, oppD:0, selfD:-35, hpR:42, cd:2,
             flavors:["轟炎司深呼吸，英雄氣概回歸…「還沒結束，爸爸要繼續懲罰你。」","他暫時壓下快感，火焰鬍子重新燃起。"]}
        ];

        function log(html) {
            const logEl = document.getElementById('log');
            const div = document.createElement('div');
            div.className = 'log-entry';
            div.innerHTML = html;
            logEl.appendChild(div);
            logEl.scrollTop = logEl.scrollHeight;
        }

        function updateBars() {
            document.getElementById('p-hp-bar').style.width = Math.max(0, pHP) + '%';
            document.getElementById('p-hp-text').textContent = Math.floor(pHP) + '/100';
            const pBar = document.getElementById('p-pleasure-bar');
            pBar.style.width = Math.min(100, pPleasure) + '%';
            document.getElementById('p-pleasure-text').textContent = Math.floor(pPleasure) + '/100';
            if (pPleasure >= 80) pBar.classList.add('warning'); else pBar.classList.remove('warning');

            document.getElementById('e-hp-bar').style.width = Math.max(0, eHP) + '%';
            document.getElementById('e-hp-text').textContent = Math.floor(eHP) + '/100';
            const eBar = document.getElementById('e-pleasure-bar');
            eBar.style.width = Math.min(100, ePleasure) + '%';
            document.getElementById('e-pleasure-text').textContent = Math.floor(ePleasure) + '/100';
            if (ePleasure >= 80) eBar.classList.add('warning'); else eBar.classList.remove('warning');
        }

        function renderSkills() {
            const grid = document.getElementById('skills-grid');
            grid.innerHTML = '';
            playerSkills.forEach((sk, i) => {
                const disabled = pCooldown[i] > 0 || pHP < sk.cost;
                const btn = document.createElement('div');
                btn.className = `skill-btn ${disabled ? 'disabled' : ''}`;
                btn.innerHTML = `
                    <div style="font-weight:700; font-size:15px;">${sk.name}</div>
                    <div style="font-size:12px; opacity:0.85;">${sk.shortDesc}</div>
                    ${pCooldown[i]>0 ? `<div class="cooldown">${pCooldown[i]}回</div>` : ''}
                `;
                if (!disabled) btn.onclick = () => playerUseSkill(i);
                grid.appendChild(btn);
            });
        }

        function executeSkill(isPlayer, idx) {
            const skills = isPlayer ? playerSkills : enemySkills;
            const skill = skills[idx];
            const cdArr = isPlayer ? pCooldown : eCooldown;
            
            if (isPlayer) pHP -= skill.cost;
            else eHP -= skill.cost;
            
            if (skill.hpR) {
                if (isPlayer) pHP += skill.hpR;
                else eHP += skill.hpR;
            }
            
            if (isPlayer) {
                pPleasure += skill.selfD;
                ePleasure += skill.oppD;
            } else {
                ePleasure += skill.selfD;
                pPleasure += skill.oppD;
            }
            
            pHP = Math.max(0, Math.min(100, pHP));
            eHP = Math.max(0, Math.min(100, eHP));
            pPleasure = Math.max(0, Math.min(100, pPleasure));
            ePleasure = Math.max(0, Math.min(100, ePleasure));
            
            cdArr[idx] = skill.cd;
            
            const flavor = skill.flavors[Math.floor(Math.random() * skill.flavors.length)];
            
            let html = '';
            if (isPlayer) {
                html = `<div style="font-size:13px;opacity:0.7;">第 ${round+1} 回合 • 轟燈矢</div>
                        <strong class="player-turn">你使用了「${skill.name}」！</strong><br>${flavor}`;
            } else {
                html = `<div style="font-size:13px;opacity:0.7;">第 ${round+1} 回合 • 轟炎司</div>
                        <strong class="enemy-turn">轟炎司使用了「${skill.name}」！</strong><br>${flavor}`;
            }
            log(html);
            updateBars();
        }

        function checkEnd() {
            if (gameEnded) return true;
            let title = '', resultText = '';
            
            if (pPleasure >= 100) {
                title = "😩 你輸了…高潮了";
                resultText = `轟炎司抱緊全身痙攣的你，溫柔地親吻你的額頭，低聲呢喃：<br>
                「燈矢…兒子的精液終於回家了…爸爸的子宮（雖然是想像的）好滿…好溫暖…爸爸好高興你回來了…❤️」`;
            } else if (ePleasure >= 100) {
                title = "🎉 你贏了！操死老爸";
                resultText = `轟炎司高潮了！他全身發抖，羞恥地紅著臉對你說：<br>
                「不孝子…老爸居然被自己的親生兒子幹到高潮…好愧疚…好羞恥…但…屁股被你幹得太爽了…爸爸壞掉了…」`;
            } else if (pHP <= 0) {
                title = "😩 你輸了…累趴";
                resultText = `你徹底累癱，老爸溫柔地把你抱在懷裡，輕撫你的頭髮：<br>
                「燈矢…累壞了吧？兒子的精液已經全部射進爸爸體內…爸爸好滿足…好高興你回家了…❤️」`;
            } else if (eHP <= 0) {
                title = "🎉 你贏了！操死老爸";
                resultText = `轟炎司徹底累趴，他喘著氣看著你，羞恥又色情地低語：<br>
                「不孝子…老爸居然被你操到動不了…好愧疚…爸爸的後穴被兒子幹壞了…但…真的好爽…對不起…」`;
            }
            
            if (title) {
                gameEnded = true;
                document.getElementById('modal-title').innerHTML = title;
                document.getElementById('modal-result').innerHTML = resultText;
                document.getElementById('final-rounds').textContent = round;
                document.getElementById('final-p-hp').textContent = Math.floor(pHP);
                document.getElementById('final-p-pleasure').textContent = Math.floor(pPleasure);
                document.getElementById('final-e-hp').textContent = Math.floor(eHP);
                document.getElementById('final-e-pleasure').textContent = Math.floor(ePleasure);
                document.getElementById('modal').style.display = 'flex';
                return true;
            }
            return false;
        }

        function playerUseSkill(i) {
            if (gameEnded || pCooldown[i] > 0 || pHP < playerSkills[i].cost) return;
            executeSkill(true, i);
            if (checkEnd()) return;
            setTimeout(aiTurn, 700);
        }

        function aiTurn() {
            if (gameEnded) return;
            
            let choice = 0;
            if (ePleasure >= 72) {
                const rec = enemySkills.findIndex(s => s.hpR > 0);
                if (rec !== -1 && eCooldown[rec] === 0) choice = rec;
            }
            else if (pPleasure >= 75) {
                let maxDmg = -1;
                for (let i=0; i<6; i++) {
                    if (eCooldown[i]===0 && eHP >= enemySkills[i].cost && enemySkills[i].oppD > maxDmg) {
                        maxDmg = enemySkills[i].oppD;
                        choice = i;
                    }
                }
            }
            else {
                const valid = [];
                for (let i=0; i<6; i++) {
                    if (eCooldown[i]===0 && eHP >= enemySkills[i].cost) valid.push(i);
                }
                if (valid.length) choice = valid[Math.floor(Math.random()*valid.length)];
            }
            
            executeSkill(false, choice);
            round++;
            
            for (let i=0; i<6; i++) {
                if (pCooldown[i]>0) pCooldown[i]--;
                if (eCooldown[i]>0) eCooldown[i]--;
            }
            
            renderSkills();
            checkEnd();
        }

        function restartGame() {
            pHP = 100; pPleasure = 0;
            eHP = 100; ePleasure = 0;
            round = 0;
            gameEnded = false;
            pCooldown = new Array(6).fill(0);
            eCooldown = new Array(6).fill(0);
            
            document.getElementById('log').innerHTML = `<div style="text-align:center; padding:20px 0; opacity:0.8;">🔥 新一局開始！<br>轟燈矢 目標：操死老爸😍</div>`;
