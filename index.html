
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link rel="apple-touch-icon" href="IMG_4003.png">
    <link rel="icon" href="IMG_4003.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>性愛格鬥 - 轟燈矢 vs 轟炎司</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        
        :root {
            --bg: #1f1b2e;
            --panel: #2a2438;
            --accent: #ff4d4d;
            --stamina: #7fb8a8;
            --pleasure: #ff4d94;
            --text: #f0e6d8;
        }
        
        * { margin:0; padding:0; box-sizing:border-box; }
        

        
        body {
            font-family: 'Noto Sans TC', system-ui, sans-serif;
            background: linear-gradient(180deg, #1f1b2e 0%, #16121f 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
            
        #app {
            width: 100%;
            max-width: 480px;
            background: var(--panel);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            border: 3px solid var(--accent);
        }
        
        header { background: linear-gradient(90deg, #3a2e4f, #5c4866); padding: 14px; text-align: center; font-size: 22px; font-weight: 700; color: #fff; }
        
        .status-container {
            display: flex;
            padding: 16px 20px 10px;
            gap: 12px;
            background: #221d32;
        }
        
        .player-panel, .enemy-panel {
            flex: 1;
            background: rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 12px;
        }
        
        .player-panel { border: 2px solid #ff8c00; }
        .enemy-panel { border: 2px solid #ff4d94; }
        
        .name {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .bars { display: flex; flex-direction: column; gap: 10px; }
        
        .bar-label {
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 3px;
        }
        
        .bar-outer {
            height: 18px;
            background: #16121f;
            border-radius: 9999px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.1);
        }
        
        .bar-inner {
            height: 100%;
            transition: width 0.4s ease;
            border-radius: 9999px;
        }
        
        .stamina-bar { background: linear-gradient(90deg, #7fb8a8, #a3d9c9); }
        .pleasure-bar { background: linear-gradient(90deg, #ff4d94, #ff99cc); }
        
        .pleasure-bar.warning {
            animation: pulse 800ms infinite alternate;
        }
        
        @keyframes pulse {
            from { box-shadow: 0 0 8px #ff4d94; }
            to { box-shadow: 0 0 20px #ff4d94; }
        }
        .log-container { height: 260px; background: #16121f; margin: 0 16px 12px; border-radius: 14px; padding: 14px; overflow-y: auto; font-size: 15px; line-height: 1.5; }
        .log-entry { margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px dashed rgba(255,77,77,0.3); }
        .player-turn { color: #ff8c00; }
        .enemy-turn { color: #ff4d94; }
        
        .skills-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; padding: 16px; background: #221d32; }
        .skill-btn { background: rgba(255,255,255,0.1); border: 2px solid var(--accent); border-radius: 12px; padding: 12px 8px; text-align: center; min-height: 92px; display: flex; flex-direction: column; justify-content: center; cursor: pointer; transition: all 0.2s; position: relative; }
        .skill-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(255,77,77,0.4); }
        .skill-btn:disabled { opacity: 0.4; filter: grayscale(1); cursor: not-allowed; }
        .cooldown { position: absolute; top: 6px; right: 6px; background: #ff4d94; color: white; font-size: 10px; padding: 2px 6px; border-radius: 9999px; }
        
        .modal, #pregnantModal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 9999; }
        .modal-content { max-height: 85vh; overflow-y: auto;border-radius: 24px;background: #2a2438; width: 92%; max-width: 420px; border-radius: 20px; padding: 28px 24px; text-align: center; border: 4px solid #ff4d4d; }
        #pregnantModal .modal-content { background: linear-gradient(180deg, #ff99cc, #ff4d94); border: 4px solid #fff; color: #fff; box-shadow: 0 0 30px #ff69b4; }
        
        button.restart, button.choice-btn { background: linear-gradient(90deg, #ff4d94, #ff8c00); color: white; border: none; padding: 14px 28px; font-size: 18px; font-weight: 700; border-radius: 9999px; width: 100%; margin-top: 16px; cursor: pointer; }
        .choice-btn { display: inline-block; width: 48%; margin: 10px 1%; }
        .gallery-btn {
           background: rgba(255,255,255,0.08);
           border: 2px solid #ff4d94;
           color: #ff99cc;
           padding: 6px 12px;
           font-size: 13px;
           border-radius: 10px;
         }

        .gallery-btn:hover {
           transform: translateY(-1px);
           box-shadow: 0 6px 14px rgba(255,77,148,0.6);
         }

        .gallery-btn:active {
          transform: scale(0.96);
         }
    </style>
</head>
<body>
    <div id="app">
        <header>🔥 性愛格鬥 🔥<br>轟燈矢（攻） vs 轟炎司（受）</header>
        
        <div class="status-container">
            <div class="player-panel">
                <div class="name">轟燈矢 🏹 🐍</div>
                <div class="bars">
                    <div class="bar-group"><div class="bar-label"><span>體力</span><span id="p-hp-text">100/100</span></div><div class="bar-outer"><div id="p-hp-bar" class="bar-inner stamina-bar" style="width:100%"></div></div></div>
                    <div class="bar-group"><div class="bar-label"><span>快感</span><span id="p-pleasure-text">0/100</span></div><div class="bar-outer"><div id="p-pleasure-bar" class="bar-inner pleasure-bar" style="width:0%"></div></div></div>
                </div>
            </div>
            <div class="enemy-panel">
                <div class="name">轟炎司 🔥 🦧</div>
                <div class="bars">
                    <div class="bar-group"><div class="bar-label"><span>體力</span><span id="e-hp-text">100/100</span></div><div class="bar-outer"><div id="e-hp-bar" class="bar-inner stamina-bar" style="width:100%"></div></div></div>
                    <div class="bar-group"><div class="bar-label"><span>快感</span><span id="e-pleasure-text">0/100</span></div><div class="bar-outer"><div id="e-pleasure-bar" class="bar-inner pleasure-bar" style="width:0%"></div></div></div>
                </div>
            </div>
        </div>
        
        <div style="text-align:right; padding:0 16px;">
        <button class="gallery-btn" onclick="openGallery()" style="font-size:13px; padding:5px 10px;">
    💞轟家相簿💞</button>
        </div>
        <div id="log" class="log-container"></div>
        <div id="skills-grid" class="skills-grid"></div>
    </div>

    <!-- 一般結束 Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title" style="margin-bottom:12px;"></h2>
            <div id="modal-result" style="line-height:1.6; font-size:15.5px; margin:16px 0;"></div>
            <div style="background:#16121f; padding:14px; border-radius:12px; text-align:left; font-size:14px; margin:20px 0;">
                <div>回合數：<span id="final-rounds"></span></div>
                <div>轟燈矢 最終：體力 <span id="final-p-hp"></span>　快感 <span id="final-p-pleasure"></span></div>
                <div>轟炎司 最終：體力 <span id="final-e-hp"></span>　快感 <span id="final-e-pleasure"></span></div>
                <div style="margin-top:8px; color:#ff8c00; font-weight:700;">連續勝利：<span id="final-streak">0</span>/3</div>
            </div>
            <button onclick="restartGame()" class="restart">🔄 再來一局</button>
        </div>
    </div>

    <!-- 隱藏懷孕結局 Modal -->
    <div id="pregnantModal" class="modal">
        <div class="modal-content">
            <h2 style="color:#fff; margin-bottom:16px;">❤️轟炎司懷孕了❤️</h2>
            <img id="cgImage" style="width:100%; border-radius:12px; margin-bottom:12px; display:none;">
            <div id="pregnantText" style="font-size:16px; line-height:1.7; margin:20px 0; color:#fff;"></div>
            <div style="margin:25px 0;">
              <div id="choiceArea" style="margin:25px 0;">
                <button onclick="chooseBirth(true)" class="choice-btn">生下來</button>
                <button onclick="chooseBirth(false)" class="choice-btn">墮掉</button>
              </div>  
            </div>
            <button onclick="restartGame()" class="restart" style="background:#fff; color:#ff4d94;">🔄 再來一局</button>
        </div>
    </div>
    <div id="cgZoom" onclick="closeCGZoom()" style="
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.9);
            display:none;
            align-items:center;
            justify-content:center;
            z-index:99999;
        ">
            <img id="cgZoomImg" style="
                max-width:90%;
                max-height:90%;
                border-radius:12px;
                box-shadow:0 0 30px rgba(255,77,153,0.6);
            ">
        </div>    

    <script>
        let pHP = 100, pPleasure = 0;
        let eHP = 100, ePleasure = 0;
        let round = 0;
        let gameEnded = false;
        let winStreak = 0;
        let birthCount = 0;        // ← 新增：生胎計數器
        let hasCancer = false;   // ← 新增：是否罹患睪丸癌

        let pCooldown = new Array(6).fill(0);
        let eCooldown = new Array(6).fill(0);
        let cgUnlocked = {
            pregnant: false,
            birth: false,
            abort: false
        };//解鎖狀態
        

        const WIN_STREAK_REQUIRED = 3;   // ←←← 測試用3，正式版請改成5

        const playerSkills = [
            {id:0, name:"深喉老爸", shortDesc:"消耗14體力，對方+30快感", cost:14, oppD:30, selfD:8, hpR:0, cd:0,
             flavors:["你跪在老爸面前用力深喉他的粗屌，病嬌低語：「老爸…你是我的…」","你把老爸的肉棒吞到喉嚨深處，眼睛發紅地吸吮."]},
            {id:1, name:"手指玩前列腺", shortDesc:"消耗16體力，對方+38快感", cost:16, oppD:38, selfD:10, hpR:0, cd:0,
             flavors:["你把手指插進老爸後穴，猛摳前列腺：「老爸…這裡是我的專屬…」","手指快速抽插，老爸的後穴不停收縮."]},
            {id:2, name:"打屁股狂幹", shortDesc:"消耗18體力，對方+48快感（自+15）", cost:18, oppD:48, selfD:15, hpR:0, cd:1,
             flavors:["你用力打老爸屁股留下鮮紅巴掌印，同時猛插後穴：「老爸…你的屁股好紅…」","啪啪的打屁股聲響起，老爸被打得又紅又腫，你繼續狂幹."]},
            {id:3, name:"騎乘位爆插", shortDesc:"消耗24體力，對方+58快感", cost:24, oppD:58, selfD:18, hpR:0, cd:0,
             flavors:["你騎在老爸身上瘋狂套弄，邊打他胸部邊插：「老爸…被兒子騎的感覺如何？」","你用力壓著老爸胸部猛幹."]},
            {id:4, name:"火焰SM", shortDesc:"消耗35體力，對方+82快感（冷卻4）", cost:35, oppD:82, selfD:25, hpR:0, cd:4,
             flavors:["你用火焰在老爸屁股和胸口畫出淫紋，一邊猛幹一邊燒：「老爸…火焰對你只是小case吧？那就好好被兒子玩…」","火焰SM讓老爸全身發燙，你笑得病嬌."]},
            {id:5, name:"喘息恢復", shortDesc:"恢復40體力，-30快感（冷卻3）", cost:0, oppD:0, selfD:-30, hpR:40, cd:3,
             flavors:["你深呼吸壓下快感，繼續用病嬌眼神盯著老爸：「還沒玩夠…」"]},
            // 新增技能（預設先隱藏）
            {id:6, name:"孕肚玩弄", shortDesc:"消耗28體力，對方+65快感（需3胎）", cost:28, oppD:65, selfD:12, hpR:0, cd:2,
             flavors:["你輕柔又病態地揉捏老爸圓潤的孕肚，在他耳邊低語：「這裡面……有我的孩子……」","你一邊抽插一邊按壓孕肚，感受裡面的胎動。"]},
            {id:7, name:"乳汁榨取", shortDesc:"消耗32體力，對方+78快感（需5胎）", cost:32, oppD:78, selfD:18, hpR:0, cd:3,
             flavors:["你低頭含住老爸腫脹的乳頭，用力吸吮噴出的乳汁：「老爸的奶……好甜……」","你一邊猛幹一邊大力擠奶，乳汁噴得兩人滿身都是。"]}

        ];

        const enemySkills = [
            {id:0, name:"小穴縮緊", shortDesc:"消耗12體力，對方+28快感", cost:12, oppD:28, selfD:6, hpR:0, cd:0,
             flavors:["轟炎司羞恥地用力縮緊後穴，死死夾住你的肉棒…","老爸的後穴突然劇烈收縮，讓你爽得腰發軟."]},
            {id:1, name:"扭腰承受", shortDesc:"消耗15體力，對方+36快感", cost:15, oppD:36, selfD:9, hpR:0, cd:0,
             flavors:["老爸被插得忍不住扭腰，後穴不停收縮…","轟炎司咬唇，屁股無意識地往後頂."]},
            {id:2, name:"羞恥縮穴", shortDesc:"消耗22體力，對方+50快感（冷卻1）", cost:22, oppD:50, selfD:12, hpR:0, cd:1,
             flavors:["老爸全身通紅，後穴劇烈痙攣收縮：「燈矢…太深了…」","被幹得小穴不停抽動，老爸的聲音都變調了."]},
            {id:3, name:"被動後入", shortDesc:"消耗26體力，對方+60快感", cost:26, oppD:60, selfD:16, hpR:0, cd:0,
             flavors:["老爸被你從後面猛幹，只能抓著床單默默承受…","轟炎司的後穴又濕又熱，被插得不停收縮."]},
            {id:4, name:"極限高潮", shortDesc:"消耗40體力，對方+90快感（冷卻5）", cost:40, oppD:90, selfD:30, hpR:0, cd:5,
             flavors:["老爸徹底被你幹到極限，後穴狂縮，全身劇烈痙攣…"]},
            {id:5, name:"英雄喘息", shortDesc:"恢復42體力，-35快感（冷卻2）", cost:0, oppD:0, selfD:-35, hpR:42, cd:2,
             flavors:["轟炎司努力壓下快感，後穴依然微微抽動…"]}
        ];
        //統一CG資料
        const CG_LIST = {
            pregnant: {
               name: "悄然結果",
               img: "cg_pregnant.PNG"
            },
            birth: {
               name: "血脈延續",
               img: "cg_birth.PNG"
            },
            abort: {
               name: "被深愛者親手摧毀",
               img: "cg_abort.PNG"
            },
            cancer: {
               name: "錯誤的兩條線",
               img: "cg_cancer.PNG"
            },
            intrude: {
               name: "失💓禁💓高💓潮💓",
               img: "cg_intrude.PNG"
            }
        };

        function log(html) {
            const logEl = document.getElementById('log');
            const div = document.createElement('div');
            div.className = 'log-entry';
            div.innerHTML = html;
            logEl.appendChild(div);
            logEl.scrollTop = logEl.scrollHeight;
        }

        function updateBars() {
            document.getElementById('p-hp-bar').style.width = Math.max(0, pHP) + '%';
            document.getElementById('p-hp-text').textContent = Math.floor(pHP) + '/100';
            const pBar = document.getElementById('p-pleasure-bar');
            pBar.style.width = Math.min(100, pPleasure) + '%';
            document.getElementById('p-pleasure-text').textContent = Math.floor(pPleasure) + '/100';
            if (pPleasure >= 80) pBar.classList.add('warning'); else pBar.classList.remove('warning');

            document.getElementById('e-hp-bar').style.width = Math.max(0, eHP) + '%';
            document.getElementById('e-hp-text').textContent = Math.floor(eHP) + '/100';
            const eBar = document.getElementById('e-pleasure-bar');
            eBar.style.width = Math.min(100, ePleasure) + '%';
            document.getElementById('e-pleasure-text').textContent = Math.floor(ePleasure) + '/100';
            if (ePleasure >= 80) eBar.classList.add('warning'); else eBar.classList.remove('warning');
        }

        function renderSkills() {
            const grid = document.getElementById('skills-grid');
            grid.innerHTML = '';
            playerSkills.forEach((sk, i) => {
                      // 條件判斷
                   if (sk.id === 6 && birthCount < 3) return;   // 孕肚玩弄需3胎
                   if (sk.id === 7 && birthCount < 5) return;   // 乳汁榨取需5胎
        
                const disabled = pCooldown[i] > 0 || pHP < sk.cost;
                const btn = document.createElement('div');
                btn.className = `skill-btn ${disabled ? 'disabled' : ''}`;
                btn.innerHTML = `
                    <div style="font-weight:700; font-size:15px;">${sk.name}</div>
                    <div style="font-size:12px; opacity:0.85;">${sk.shortDesc}</div>
                    ${pCooldown[i]>0 ? `<div class="cooldown">${pCooldown[i]}回</div>` : ''}
                `;
                if (!disabled) btn.onclick = () => playerUseSkill(i);
                grid.appendChild(btn);
            });
        }

        function executeSkill(isPlayer, idx) {
            const skills = isPlayer ? playerSkills : enemySkills;
            const skill = skills[idx];
            const cdArr = isPlayer ? pCooldown : eCooldown;
            
            if (isPlayer) pHP -= skill.cost;
            else eHP -= skill.cost;
    
             if (skill.hpR) {
                  if (isPlayer) pHP += skill.hpR;
                  else eHP += skill.hpR;
             }
    
            let pleasureDamage = skill.oppD;
    
             // ⭐⭐ 癌症效果：炎司變得很不容易得到快感
            if (!isPlayer && hasCancer) {
                pleasureDamage = Math.floor(pleasureDamage * 0.65);   // 只剩 35% 快感傷害
             }
    
           if (isPlayer) {
               pPleasure += skill.selfD;
               ePleasure += pleasureDamage;
           } else {
               ePleasure += skill.selfD;
               pPleasure += pleasureDamage;
           }
            
            pHP = Math.max(0, Math.min(100, pHP));
            eHP = Math.max(0, Math.min(100, eHP));
            pPleasure = Math.max(0, Math.min(100, pPleasure));
            ePleasure = Math.max(0, Math.min(100, ePleasure));
            
            cdArr[idx] = skill.cd;
            
            const flavor = skill.flavors[Math.floor(Math.random() * skill.flavors.length)];
            
            let html = '';
            if (isPlayer) {
                html = `<div style="font-size:13px;opacity:0.7;">第 ${round+1} 回合 • 轟燈矢</div>
                        <strong class="player-turn">你使用了「${skill.name}」！</strong><br>${flavor}`;
            } else {
                html = `<div style="font-size:13px;opacity:0.7;">第 ${round+1} 回合 • 轟炎司</div>
                        <strong class="enemy-turn">轟炎司使用了「${skill.name}」！</strong><br>${flavor}`;
            }
            log(html);
            updateBars();
        }
        
        function checkSpecialEvents() {
            if (gameEnded) return true;

            // 😱 闖入事件（戰鬥中）
            if (Math.random() < 0.08) {
                showIntrudeEnding();
                return true;
             }

            return false;
        }

         function checkEnd() {
            if (gameEnded) return true;
            let isWin = (ePleasure >= 100 || eHP <= 0);
            let title = '', resultText = '';

            if (pPleasure >= 100) {
                title = "😩 你輸了…";
                resultText = `轟炎司溫柔抱著你…`;
                winStreak = 0;
            } else if (isWin) {
                winStreak++;
                title = "🎉 你贏了！操壞老爸";
                resultText = `轟炎司徹底被你操壞…`;

                 if (winStreak >= WIN_STREAK_REQUIRED) {
                    const roll = Math.random();
                    if (roll < 0.8) {
                     showPregnantModal(); // 80%
                    } else {
                     showCancerEnding(); // 20%（自動吃剩下的）
                    }
                    winStreak = 0;
                    return true;
                 }
            } else if (pHP <= 0) {
                title = "😩 你輸了…";
                resultText = `你累癱在老爸懷裡…`;
                winStreak = 0;
            }

            if (title) {
                gameEnded = true;
                document.getElementById('modal-title').innerHTML = title;
                document.getElementById('modal-result').innerHTML = resultText;
                document.getElementById('final-rounds').textContent = round;
                document.getElementById('final-p-hp').textContent = Math.floor(pHP);
                document.getElementById('final-p-pleasure').textContent = Math.floor(pPleasure);
                document.getElementById('final-e-hp').textContent = Math.floor(eHP);

        function playerUseSkill(i) {
            if (gameEnded || pCooldown[i] > 0 || pHP < playerSkills[i].cost) return;
           
            
            executeSkill(true, i);
            if (checkEnd()) return;
            setTimeout(aiTurn, 700);
        }

        function aiTurn() {
            if (gameEnded) return;
            
                // ⭐ 插在這裡
            if (checkSpecialEvents()) return;
            
            round++;
            
            let choice = 0;
            if (ePleasure >= 72) {
                const rec = enemySkills.findIndex(s => s.hpR > 0);
                if (rec !== -1 && eCooldown[rec] === 0) choice = rec;
            } else if (pPleasure >= 75) {
                let maxDmg = -1;
                for (let i=0; i<6; i++) {
                    if (eCooldown[i]===0 && eHP >= enemySkills[i].cost && enemySkills[i].oppD > maxDmg) {
                        maxDmg = enemySkills[i].oppD;
                        choice = i;
                    }
                }
            } else {
                const valid = [];
                for (let i=0; i<6; i++) {
                    if (eCooldown[i]===0 && eHP >= enemySkills[i].cost) valid.push(i);
                }
                if (valid.length) choice = valid[Math.floor(Math.random()*valid.length)];
            }
            
            executeSkill(false, choice);
            //round++;gpt移上去
            
            for (let i=0; i<6; i++) {
                if (pCooldown[i]>0) pCooldown[i]--;
                if (eCooldown[i]>0) eCooldown[i]--;
            }
            
            renderSkills();
            checkEnd();
        }

           // winStreak = 0;

        }
